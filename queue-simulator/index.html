
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Data Structure Simulator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="queue.js" defer></script>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Queue Data Structure Simulator</h1>

    <div class="row">
        <div class="col-md-4">
            <h3>Operations</h3>
            <input type="number" id="data" class="form-control mb-3" placeholder="Enter a value">

            <button id="enqueue" class="btn btn-primary btn-block mb-2">Enqueue</button>
            <button id="dequeue" class="btn btn-danger btn-block mb-2">Dequeue</button>
            <button id="peek" class="btn btn-warning btn-block mb-2">Peek</button>
            <button id="clear" class="btn btn-secondary btn-block">Clear</button>
        </div>

        <div class="col-md-4">
            <h3>Queue Data</h3>
            <div id="queue" class="queue-container">
                <div class="front-label">FRONT</div>
                <div id="queue-items"></div>
                <div class="rear-label">REAR</div>
            </div>
        </div>

        <div class="col-md-4">
            <h3>Deleted from Queue</h3>
            <div id="deleted" class="deleted"></div>
        </div>
    </div>
</div>

</body>
</html>
